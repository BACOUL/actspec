name: HS30 D5 native Windows proof
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-proof:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node hs30-native-windows-proof.mjs
